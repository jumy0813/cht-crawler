name: 每日中華電信輿情爬蟲

on:
  schedule:
    # UTC 時間 01:00 = 台灣時間每天早上 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載倉庫最新檔案
        uses: actions/checkout@v6

      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 3. 安裝中文字型與爬蟲繪圖套件
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install requests beautifulsoup4 pandas lxml matplotlib

      - name: 4. 先產生最新儀表板並推送至倉庫（供 LINE 讀取圖片網址）
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python all_in_one.py --step crawl_and_plot

      - name: 5. 將更新後的 CSV 與儀表板圖片存回 GitHub 倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          [ -f cht_all_platforms.csv ] && git add cht_all_platforms.csv
          [ -f dashboard.png ] && git add dashboard.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新每日輿情資料與儀表板" && git push)

      - name: 6. 發送包含儀表板圖片的 LINE 通知
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python all_in_one.py --step notify
